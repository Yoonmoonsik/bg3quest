<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BG3 퀘스트 일지 · BG3 Quest Journal</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="head-row">
    <h1 data-i18n="title">BG3 퀘스트 일지</h1>
    <div class="head-tools"><button id="tech" type="button" class="tech-btn"></button>
    <a class="help-link" href="https://yoonmoonsik.github.io/bg3book/" data-i18n="site_book"></a>
    <a class="help-link" href="https://yoonmoonsik.github.io/bg3dnd/" data-i18n="site_dnd"></a>
    <a id="help" class="help-link" href="help.html" data-i18n="help"></a>
    <div class="ui-lang" role="group" aria-label="Language">
      <button type="button" data-ui="ko">한국어</button><button type="button" data-ui="en">English</button>
    </div></div>
  </div>
  <p class="sub"><span data-i18n="sub"></span> <span id="total"></span></p>
</header>
<div class="layout">
  <aside class="filters">
    <input id="q" type="search" autocomplete="off">
    <label><span data-i18n="f-c"></span> <select id="f-c"></select></label>
    <label><span data-i18n="f-ac"></span> <select id="f-ac"></select></label>
    <label><span data-i18n="f-v"></span> <select id="f-v"></select></label>
    <label><span data-i18n="f-rw"></span> <select id="f-rw"></select></label>
    <label><span data-i18n="f-st"></span> <select id="f-st"></select></label>
    <button id="reset" type="button" data-i18n="reset"></button>
    <button id="show-hid" type="button"></button>
    <div class="mark-tools"><button id="export" type="button" data-i18n="export"></button><button id="export-md" type="button" data-i18n="exportMd"></button><button id="import" type="button" data-i18n="import"></button><button id="reset-marks" type="button" data-i18n="resetMarks"></button></div>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
    <p class="count" id="count"></p>
    <ul id="list"></ul>
  </aside>
  <main id="detail"></main>
</div>
<footer data-i18n="footer"></footer>
<script src="app.js"></script>
</body>
</html>
