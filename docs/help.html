<script>

    p_list_k: "분류 접기", p_list: "분류 머리줄을 눌러 접고 펼칩니다. 처음에는 모두 접혀 있고, 검색 중이거나 퀘스트 링크로 들어오면 해당 분류가 펼쳐집니다.",

    p_list_k: "Category folding", p_list: "Click a category header to fold or unfold it. All start folded; a search or a quest link opens the matching categories.",
    p_file_k: "Export · Import", p_file: "Export progress saves JSON. Export and Copy Markdown give a .md file or clipboard text with completed marks and completed steps of quests that are not hidden. Import progress replaces your current marks with an exported JSON file; Restore previous progress brings back what the import replaced. Reset progress clears everything.",
    p_note: "Progress is saved only in this browser. Use export and import to move it to another device or browser.",
  },
};
let ui = new URLSearchParams(location.search).get("lang");
if (!T[ui]) { try { ui = localStorage.getItem("ui"); } catch (e) { /* storage blocked */ } }
if (!T[ui]) ui = "ko";
function applyUi() {
  document.documentElement.lang = ui;
  document.title = T[ui].doc;
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[ui][el.dataset.t]));
  document.querySelectorAll("[data-ui]").forEach((b) => b.classList.toggle("on", b.dataset.ui === ui));
  document.getElementById("back").href = "index.html?lang=" + ui;
}
document.querySelectorAll("[data-ui]").forEach((b) => b.addEventListener("click", () => {
  ui = b.dataset.ui;
  try { localStorage.setItem("ui", ui); } catch (e) { /* storage blocked */ }
  applyUi();
}));
applyUi();
</script>
