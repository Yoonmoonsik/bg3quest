<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도움말 · BG3 퀘스트 일지</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='1' width='12' height='14' rx='2' fill='%23d4a24c'/><path d='M5 5h6M5 8h6M5 11h4' stroke='%2315110d' stroke-width='1.4'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="head-row">
    <h1 data-t="title"></h1>
    <div class="head-tools"><a id="back" class="help-link" href="index.html" data-t="back"></a>
    <div class="ui-lang" role="group" aria-label="Language">
      <button type="button" data-ui="ko">한국어</button><button type="button" data-ui="en">English</button>
    </div></div>
  </div>
</header>
<main class="help">
  <h2 data-t="keys"></h2>
  <table>
    <tbody>
      <tr><td><kbd>T</kbd></td><td data-t="t"></td></tr>
    </tbody>
  </table>
  <p data-t="note"></p>
</main>
<script>
const T = {
  ko: {
    title: "도움말", back: "◀ 퀘스트 일지로", keys: "키보드 단축키",
    t: "기술 정보(퀘스트·단계·목표 ID, GUID, 개발 메모, 마커 레벨·대상, UnlockDisable 등) 표시·숨김. 상단의 \"기술 정보\" 버튼과 같습니다.",
    note: "검색창이나 필터 선택에 커서가 있을 때는 단축키가 작동하지 않습니다. 기술 정보 표시 여부는 이 브라우저에 저장됩니다.",
    doc: "도움말 · BG3 퀘스트 일지",
  },
  en: {
    title: "Help", back: "◀ Back to the quest journal", keys: "Keyboard shortcuts",
    t: "Show / hide technical info (quest, step and objective IDs, GUIDs, dev comments, marker levels and targets, UnlockDisable and so on). Same as the \"Technical info\" button at the top.",
    note: "Shortcuts are off while the search box or a filter has focus. The technical info setting is saved in this browser.",
    doc: "Help · BG3 Quest Journal",
  },
};
let ui = new URLSearchParams(location.search).get("lang");
if (!T[ui]) { try { ui = localStorage.getItem("ui"); } catch (e) { /* storage blocked */ } }
if (!T[ui]) ui = "ko";
function applyUi() {
  document.documentElement.lang = ui;
  document.title = T[ui].doc;
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[ui][el.dataset.t]));
  document.querySelectorAll("[data-ui]").forEach((b) => b.classList.toggle("on", b.dataset.ui === ui));
  document.getElementById("back").href = "index.html?lang=" + ui;
}
document.querySelectorAll("[data-ui]").forEach((b) => b.addEventListener("click", () => {
  ui = b.dataset.ui;
  try { localStorage.setItem("ui", ui); } catch (e) { /* storage blocked */ }
  applyUi();
}));
applyUi();
</script>
</body>
</html>
